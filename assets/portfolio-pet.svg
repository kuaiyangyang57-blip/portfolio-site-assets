<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio pet</title>
  <desc id="desc">A friendly original portfolio companion with a cursor tail, color swatch satchel, and calm expressive face.</desc>
  <defs>
    <linearGradient id="body" x1="254" y1="210" x2="744" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6f3ed"/>
      <stop offset="0.48" stop-color="#dfe4df"/>
      <stop offset="1" stop-color="#9aa59f"/>
    </linearGradient>
    <linearGradient id="shadow" x1="252" y1="708" x2="746" y2="808" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101816" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#101816" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#101816" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ear" x1="240" y1="126" x2="424" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#363d3a"/>
      <stop offset="1" stop-color="#19201e"/>
    </linearGradient>
    <linearGradient id="coral" x1="612" y1="520" x2="760" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8e76"/>
      <stop offset="1" stop-color="#de5f4f"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#26312d" flood-opacity="0.18"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

